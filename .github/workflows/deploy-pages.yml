name: Deploy Frisco Weather Map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Inject CARTO API key
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          test -n "$CARTO_API_KEY" || { echo "CARTO_API_KEY repository secret is missing"; exit 1; }

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          key = os.environ["CARTO_API_KEY"]

          Path("js/config.js").write_text(
              "window.CARTO_API_KEY = " + json.dumps(key) + ";\n",
              encoding="utf-8"
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
